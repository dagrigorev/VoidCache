# docker-compose.k8s.yml  –  Kompose-annotated docker-compose for Kubernetes
#
# This file is designed to be converted to k8s manifests with Kompose:
#
#   kompose convert -f docker-compose.k8s.yml -o k8s/base/
#
# It also works as a standalone docker-compose for local dev:
#
#   docker compose -f docker-compose.k8s.yml up
#
# Kompose annotations control k8s-specific behaviour:
#   kompose.service.type         → k8s Service type
#   kompose.service.expose       → creates Ingress
#   kompose.controller.type      → statefulset / daemonset / deployment
#   kompose.volume.size          → PVC storage request
#   kompose.image-pull-policy    → IfNotPresent / Always
#
# After conversion:
#   kubectl apply -k k8s/base/          (Kustomize)
#   kubectl apply -f k8s/base/          (raw manifests)
# ─────────────────────────────────────────────────────────────────────────────

name: voidcache

x-vcache-node: &vcache-node
  image: ${REGISTRY:-ghcr.io/yourorg}/voidcache:${TAG:-latest}
  build:
    context: ..
    dockerfile: Dockerfile
  restart: unless-stopped
  environment:
    VC_CLUSTER: "yes"
    VC_MAXMEMORY: ${VC_MAXMEMORY:-512m}
    VC_THREADS: ${VC_THREADS:-4}
    VC_NO_WAL: ${VC_NO_WAL:-0}
  env_file:
    - .env.secret            # VC_PASSWORD (not committed to git)
  labels:
    kompose.image-pull-policy: IfNotPresent
    kompose.controller.type: statefulset
    kompose.service.type: ClusterIP

services:

  # ── VoidCache node 0 ──────────────────────────────────────────────────────
  vcache-0:
    <<: *vcache-node
    container_name: vcache-0
    hostname: vcache-0
    environment:
      VC_CLUSTER: "yes"
      VC_MAXMEMORY: ${VC_MAXMEMORY:-512m}
      VC_THREADS: ${VC_THREADS:-4}
      VC_NO_WAL: ${VC_NO_WAL:-0}
      VC_ANNOUNCE_ADDR: "vcache-0.vcache-headless.voidcache.svc.cluster.local"
      VC_ANNOUNCE_PORT: "6379"
    ports:
      - "6379"
    volumes:
      - vcache-0-data:/vcache/data
      - vcache-config:/vcache/config:ro
    labels:
      kompose.image-pull-policy: IfNotPresent
      kompose.controller.type: statefulset
      kompose.service.type: ClusterIP
      kompose.volume.size: 10Gi
    healthcheck:
      test: ["CMD", "vcli", "-h", "127.0.0.1", "-p", "6379", "--no-color", "PING"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ── VoidCache node 1 ──────────────────────────────────────────────────────
  vcache-1:
    <<: *vcache-node
    container_name: vcache-1
    hostname: vcache-1
    environment:
      VC_CLUSTER: "yes"
      VC_MAXMEMORY: ${VC_MAXMEMORY:-512m}
      VC_THREADS: ${VC_THREADS:-4}
      VC_NO_WAL: ${VC_NO_WAL:-0}
      VC_ANNOUNCE_ADDR: "vcache-1.vcache-headless.voidcache.svc.cluster.local"
      VC_ANNOUNCE_PORT: "6379"
    ports:
      - "6379"
    volumes:
      - vcache-1-data:/vcache/data
      - vcache-config:/vcache/config:ro
    labels:
      kompose.image-pull-policy: IfNotPresent
      kompose.controller.type: statefulset
      kompose.service.type: ClusterIP
      kompose.volume.size: 10Gi
    healthcheck:
      test: ["CMD", "vcli", "-h", "127.0.0.1", "-p", "6379", "--no-color", "PING"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ── VoidCache node 2 ──────────────────────────────────────────────────────
  vcache-2:
    <<: *vcache-node
    container_name: vcache-2
    hostname: vcache-2
    environment:
      VC_CLUSTER: "yes"
      VC_MAXMEMORY: ${VC_MAXMEMORY:-512m}
      VC_THREADS: ${VC_THREADS:-4}
      VC_NO_WAL: ${VC_NO_WAL:-0}
      VC_ANNOUNCE_ADDR: "vcache-2.vcache-headless.voidcache.svc.cluster.local"
      VC_ANNOUNCE_PORT: "6379"
    ports:
      - "6379"
    volumes:
      - vcache-2-data:/vcache/data
      - vcache-config:/vcache/config:ro
    labels:
      kompose.image-pull-policy: IfNotPresent
      kompose.controller.type: statefulset
      kompose.service.type: ClusterIP
      kompose.volume.size: 10Gi
    healthcheck:
      test: ["CMD", "vcli", "-h", "127.0.0.1", "-p", "6379", "--no-color", "PING"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ── HAProxy load balancer ─────────────────────────────────────────────────
  haproxy:
    image: haproxy:2.9-alpine
    container_name: vcache-haproxy
    restart: unless-stopped
    ports:
      - "6379:6379"
      - "8404:8404"
    volumes:
      - haproxy-config:/usr/local/etc/haproxy:ro
    depends_on:
      - vcache-0
      - vcache-1
      - vcache-2
    labels:
      kompose.service.type: LoadBalancer
      kompose.service.expose: "true"
    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  vcache-0-data:
  vcache-1-data:
  vcache-2-data:
  vcache-config:
    external: true          # populated by ConfigMap / Secret in k8s
  haproxy-config:
    external: true          # populated by ConfigMap in k8s
