# haproxy.cfg  –  HAProxy config for VoidCache cluster
#
# Mode: TCP (layer 4) — passes RESP3 wire protocol through untouched.
# Health check: sends PING\r\n, expects +PONG or *1\r\n response.
# Balance: leastconn — routes new connections to the least-busy node.
# Failover: if a node fails health check 3×, it is removed until recovery.
#
# Stats UI: http://localhost:8404/stats   (user: admin / pass: admin)
# ─────────────────────────────────────────────────────────────────────────────

global
    maxconn         50000
    log             stdout  format raw  local0
    tune.ssl.default-dh-param  2048
    # Tune for high connection throughput
    tune.maxrewrite 1024
    tune.bufsize    32768

defaults
    mode            tcp
    log             global
    option          tcplog
    option          dontlognull
    option          redispatch
    retries         3
    timeout connect 3s
    timeout client  5m
    timeout server  5m
    timeout check   2s

# ── Stats & monitoring ────────────────────────────────────────────────────────
frontend stats
    bind            *:8404
    mode            http
    stats enable
    stats uri       /stats
    stats realm     VoidCache\ HAProxy
    stats auth      admin:admin
    stats refresh   5s
    stats show-legends
    stats show-node

# ── VoidCache frontend ────────────────────────────────────────────────────────
frontend vcache_frontend
    bind            *:6379
    default_backend vcache_nodes

    # Optional: rate-limit new connections per IP (uncomment for production)
    # stick-table type ip size 100k expire 30s store conn_cur,conn_rate(10s)
    # tcp-request connection track-sc0 src
    # tcp-request connection reject if { sc_conn_rate(0) gt 100 }

# ── VoidCache backend ─────────────────────────────────────────────────────────
backend vcache_nodes
    balance         leastconn
    option          tcp-check

    # Health check: send RESP inline PING, expect PONG
    tcp-check send  "PING\r\n"
    tcp-check expect string "+PONG"

    # Nodes — one per VoidCache container
    # inter=5s   — health-check interval
    # fall=3     — mark down after 3 consecutive failures
    # rise=2     — mark up after 2 consecutive successes
    # weight=10  — equal weight for leastconn
    server vcache-1 vcache-1:6379 check inter 5s fall 3 rise 2 weight 10
    server vcache-2 vcache-2:6379 check inter 5s fall 3 rise 2 weight 10
    server vcache-3 vcache-3:6379 check inter 5s fall 3 rise 2 weight 10

# ── Admin socket (for runtime management) ─────────────────────────────────────
# Enable with:  docker exec vcache-haproxy sh -c 'echo "show info" | socat stdio /tmp/haproxy.sock'
# Uncomment to enable:
# global
#   stats socket /tmp/haproxy.sock mode 660 level admin expose-fd listeners
#   stats timeout 30s
