# haproxy-tls.cfg  –  HAProxy config with TLS termination at the load balancer
#
# Clients connect to HAProxy with TLS.
# HAProxy decrypts and forwards plain TCP to VoidCache nodes on the
# internal Docker network (TLS between client↔LB, plain between LB↔nodes).
#
# To also encrypt the backend leg (TLS all the way), uncomment the
# "ssl" options on server lines and point to the same cert.
# ─────────────────────────────────────────────────────────────────────────────

global
    maxconn     50000
    log         stdout format raw local0
    tune.ssl.default-dh-param 2048

defaults
    mode        tcp
    log         global
    option      tcplog
    option      dontlognull
    retries     3
    timeout connect 3s
    timeout client  5m
    timeout server  5m
    timeout check   2s

frontend stats
    bind        *:8404
    mode        http
    stats enable
    stats uri   /stats
    stats realm VoidCache\ HAProxy
    stats auth  admin:admin
    stats refresh 5s

# TLS-terminating frontend — clients speak TLS here
frontend vcache_tls
    bind        *:6380 ssl crt /tls/haproxy.pem
    default_backend vcache_nodes_plain

# Plain frontend (internal use / direct node access)
frontend vcache_plain
    bind        *:6379
    default_backend vcache_nodes_plain

backend vcache_nodes_plain
    balance     leastconn
    option      tcp-check
    tcp-check send  "PING\r\n"
    tcp-check expect string "+PONG"

    server vcache-1 vcache-1:6379 check inter 5s fall 3 rise 2 weight 10
    server vcache-2 vcache-2:6379 check inter 5s fall 3 rise 2 weight 10
    server vcache-3 vcache-3:6379 check inter 5s fall 3 rise 2 weight 10
