{{- if .Values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "voidcache.fullname" . }}-cache-pdb
  namespace: {{ include "voidcache.namespace" . }}
  labels:
    {{- include "voidcache.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "voidcache.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: cache
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "voidcache.fullname" . }}-haproxy-pdb
  namespace: {{ include "voidcache.namespace" . }}
  labels:
    {{- include "voidcache.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "voidcache.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: proxy
{{- end }}

{{- if .Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "voidcache.fullname" . }}-haproxy-hpa
  namespace: {{ include "voidcache.namespace" . }}
  labels:
    {{- include "voidcache.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "voidcache.fullname" . }}-haproxy
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}

{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "voidcache.fullname" . }}-allow-proxy-to-cache
  namespace: {{ include "voidcache.namespace" . }}
spec:
  podSelector:
    matchLabels:
      {{- include "voidcache.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: cache
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "voidcache.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: proxy
      ports:
        - port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "voidcache.fullname" . }}-allow-cache-gossip
  namespace: {{ include "voidcache.namespace" . }}
spec:
  podSelector:
    matchLabels:
      {{- include "voidcache.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: cache
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "voidcache.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: cache
      ports:
        - port: 6379
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "voidcache.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: cache
      ports:
        - port: 6379
    - to: []
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}

{{- if .Values.metrics.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "voidcache.fullname" . }}
  namespace: {{ include "voidcache.namespace" . }}
  labels:
    {{- include "voidcache.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "voidcache.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: proxy
  endpoints:
    - port: stats
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}
{{- end }}
