---
# HAProxy Deployment — load balancer in front of the StatefulSet
#
# Unlike the cache nodes, HAProxy is stateless so a Deployment is correct.
# It references the headless Service DNS names for the backend servers.
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vcache-haproxy
  namespace: voidcache
  labels:
    app.kubernetes.io/name: voidcache
    app.kubernetes.io/component: proxy
spec:
  replicas: 2                        # two HAProxy replicas for HA
  selector:
    matchLabels:
      app.kubernetes.io/name: voidcache
      app.kubernetes.io/component: proxy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0              # zero-downtime rollout
  template:
    metadata:
      labels:
        app.kubernetes.io/name: voidcache
        app.kubernetes.io/component: proxy
      annotations:
        checksum/config: "placeholder"  # Helm replaces; kubectl users redeploy manually
    spec:
      affinity:
        # Spread HAProxy replicas across different nodes
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: proxy
                topologyKey: kubernetes.io/hostname
        # Prefer to avoid nodes that already have a cache pod
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: cache
                topologyKey: kubernetes.io/hostname

      terminationGracePeriodSeconds: 10

      securityContext:
        runAsNonRoot: true
        runAsUser: 99           # haproxy image uses uid 99
        runAsGroup: 99

      containers:
        - name: haproxy
          image: haproxy:2.9-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: resp
              containerPort: 6379
            - name: stats
              containerPort: 8404
          volumeMounts:
            - name: haproxy-config
              mountPath: /usr/local/etc/haproxy
              readOnly: true
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /stats
              port: 8404
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]

      volumes:
        - name: haproxy-config
          configMap:
            name: haproxy-config
