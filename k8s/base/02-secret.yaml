---
# Secret: VoidCache password (base64-encoded)
#
# IMPORTANT: Replace the placeholder values before deploying.
#
# Generate base64 values:
#   echo -n "your_strong_password" | base64
#
# Or use kubectl to create directly (never stores plaintext in YAML):
#   kubectl create secret generic vcache-secret \
#     --namespace=voidcache \
#     --from-literal=VC_PASSWORD=your_strong_password \
#     --from-literal=HAPROXY_STATS_PASSWORD=admin_password
#
# For production, use Sealed Secrets, Vault, or External Secrets Operator
# instead of committing this file to git.
#
apiVersion: v1
kind: Secret
metadata:
  name: vcache-secret
  namespace: voidcache
  labels:
    app.kubernetes.io/name: voidcache
    app.kubernetes.io/component: secret
type: Opaque
stringData:
  # Leave VC_PASSWORD empty to disable auth (not recommended for production)
  VC_PASSWORD: ""
  # HAProxy stats page password (overrides ConfigMap value)
  HAPROXY_STATS_PASSWORD: "admin"
