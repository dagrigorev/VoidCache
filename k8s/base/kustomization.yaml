apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: voidcache

resources:
  - 00-namespace.yaml
  - 01-configmap.yaml
  - 02-secret.yaml
  - 03-services.yaml
  - 04-statefulset.yaml
  - 05-haproxy.yaml
  - 06-pdb-hpa.yaml
  - 07-networkpolicy.yaml
  # Uncomment when cert-manager is installed:
  # - 08-tls-cert.yaml
  # Uncomment when prometheus-operator is installed:
  # - 09-monitoring.yaml

commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of: voidcache
